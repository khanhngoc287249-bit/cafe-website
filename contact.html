    <h2>Thông tin liên hệ</h2>
    <p>Địa chỉ: 123 Đường Nguyễn Huệ, Phường 1</p>
    <p>Hotline: Đang cập nhật</p>

    <h2>Đặt bàn</h2>
    <form>
      <label>
        Họ và tên:
        <input type="text" name="name" required>
      </label>
      <br><br>

      <label>
        Số điện thoại:
        <input type="tel" name="phone" required>
      </label>
      <br><br>

      <label>
        Số lượng khách:
        <input type="number" name="guests" min="1" required>
      </label>
      <br><br>

      <label for="notes">Ghi chú đặt bàn:</label>
      <br>
      <textarea id="notes" name="notes" rows="4" cols="40"></textarea>
      <br><br>

      <button type="submit">Gửi yêu cầu đặt bàn</button>
    </form>
  </main>
